name: test-proxy

# Standalone diagnostic — doesn't touch data-pipeline.yml or write anything
# to the database. Tests whether SOFASCORE_PROXY_URL actually gets past
# Sofascore's block, run from GitHub's own infrastructure (the environment
# that actually matters, not your local machine). Reusable any time proxy
# reliability is in question, not just for this one investigation — keep it
# around rather than deleting it once this is resolved.
#
# Needs the SOFASCORE_PROXY_URL secret already set for the proxy attempts to
# mean anything; the no-proxy baseline works regardless and should reliably
# fail (confirming the block itself still reproduces from a datacenter IP).
on:
  workflow_dispatch:
    inputs:
      attempts:
        description: "How many times to test the proxy"
        default: "5"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Baseline — confirm the block reproduces without a proxy
        run: python3 test_proxy.py --no-proxy --plain || true

      - name: Test the proxy, repeated
        env:
          SOFASCORE_PROXY_URL: ${{ secrets.SOFASCORE_PROXY_URL }}
        run: |
          N="${{ github.event.inputs.attempts || '5' }}"
          pass=0
          fail=0
          for i in $(seq 1 "$N"); do
            echo "--- attempt $i/$N ---"
            if PROXY_URL="$SOFASCORE_PROXY_URL" python3 test_proxy.py --plain; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
            fi
          done
          echo ""
          echo "===================================="
          echo "  $pass passed, $fail failed (of $N)"
          echo "===================================="
