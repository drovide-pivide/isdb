name: data-pipeline

# Runs the regular data-retrieval jobs against Postgres — nothing here ever
# touches the git repo. Set DATABASE_URL as a repo secret first:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: DATABASE_URL
#   Value: postgresql://user:password@host:5432/dbname  (from Neon/Supabase)
#
# Runs every morning at 06:00 UTC, unconditionally — no matchday gate.
# The old check-matchday gate existed to avoid burning paid proxy bandwidth
# on non-matchdays. There's no proxy anymore (see fetch-sofascore below), so
# that reason is gone — and gating by "was yesterday a matchday" meant a
# missed run (your Mac off) wouldn't retry until the NEXT scheduled
# matchday, which could be a two-week gap. Running daily instead means
# match_stats_fetch.py's own cache-check (db.cache_exists()) just finds
# nothing new on non-matchdays and finishes fast — and anything missed
# gets picked up the very next time your Mac is online, not weeks later.
#
# fetch-sofascore needs a real residential IP — Sofascore blocks GitHub's
# datacenter IPs and the commercial residential proxy this project used to
# rely on eventually got its own IP/ASN flagged by Sofascore specifically
# (see MIGRATION.md). So this job runs on your own self-hosted runner (your
# Mac) instead. If your Mac is offline when this fires, the job just queues
# and waits — up to 24 hours — then runs automatically the moment your
# runner comes back online. No custom retry logic needed.
#
# score-and-build doesn't touch Sofascore at all (just Understat + Postgres),
# so it stays on GitHub's free hosted runner and only waits for
# fetch-sofascore to finish first.
#
# Manual runs (workflow_dispatch) work exactly the same as the schedule.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pl_season:
        description: "PL competition key for match_stats_fetch.py (see COMPETITIONS in the script)"
        default: "pl2627"
        required: false

jobs:
  fetch-sofascore:
    # Your Mac, registered as a self-hosted runner (Gabriellas-MacBook-Air).
    # Targeting just "self-hosted" is enough as long as this is the only
    # self-hosted runner on this repo — the registration didn't get a custom
    # label added, so its actual labels are self-hosted/macOS/ARM64 only.
    # Installed as a background service (`./svc.sh install && ./svc.sh start`)
    # so it survives reboots and doesn't need a terminal window open.
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PL_SEASON: ${{ github.event.inputs.pl_season || 'pl2627' }}

    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here — this is your own Mac, not a fresh
      # ephemeral VM, so it uses whatever Python is already on the runner
      # service's PATH. If the runner service doesn't pick up your normal
      # shell's Python (e.g. a conda env activated in .zshrc but not loaded
      # by the background service), fix that before relying on the schedule
      # — check with `which python3` from a run's log, or a manual
      # workflow_dispatch test run first.

      - name: Install dependencies
        run: |
          pip uninstall -y understatapi || true
          pip install -r db/requirements.txt curl_cffi pandas numpy scikit-learn scipy joblib jeke-understat-scrapper
          python -c "import psycopg2; print('psycopg2 OK:', psycopg2.__version__)"

      - name: Sofascore — WC2026 (scores + rebuilds frontend_matches)
        run: python match_stats_fetch.py --competition wc2026
        working-directory: pipeline

      - name: Sofascore — Premier League
        run: python match_stats_fetch.py --competition "$PL_SEASON"
        working-directory: pipeline

  score-and-build:
    needs: fetch-sofascore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PL_SEASON: ${{ github.event.inputs.pl_season || 'pl2627' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip uninstall -y understatapi || true
          pip install -r db/requirements.txt pandas numpy scikit-learn scipy joblib jeke-understat-scrapper
          python -c "import psycopg2; print('psycopg2 OK:', psycopg2.__version__)"

      - name: Understat — Premier League xG timeline
        run: python pl_xg_timeline_fetch.py
        working-directory: pipeline

      - name: Score Premier League matches for excitingness
        run: |
          python -c "import psycopg2" || pip install psycopg2-binary --force-reinstall
          python predict_excitingness.py --top 0
        working-directory: .

      - name: Rebuild PL frontend rows
        run: python build_pl_frontend.py
        working-directory: pipeline
